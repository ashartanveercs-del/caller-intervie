<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>GhostAI</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Title Bar -->
    <div class="titlebar" id="titlebar">
      <div class="titlebar-drag">
        <span class="title-icon">👻</span>
        <span class="title-text">GhostAI</span>
      </div>
      <div class="titlebar-btns">
        <button class="tb-btn" id="btn-settings" title="Settings">⚙️</button>
        <button class="tb-btn" id="btn-hide" title="Hide (Alt+Shift+X)">👁️</button>
      </div>
    </div>

    <!-- STT Status Bar -->
    <div class="stt-bar" id="stt-bar">
      <div class="stt-indicator" id="stt-mic-indicator">
        <span class="stt-dot" id="stt-dot-mic"></span>
        <span>Mic</span>
        <div class="vu-container">
          <div class="vu-bar" id="vu-bar"></div>
        </div>
      </div>
      <div class="stt-indicator" id="stt-host-indicator">
        <span class="stt-dot" id="stt-dot-host"></span>
        <span>Host</span>
        <div class="vu-container">
          <div class="vu-bar" id="vu-bar-host"></div>
        </div>
      </div>
      <div class="stt-partial" id="stt-partial-text"></div>
    </div>

    <!-- Chat Area -->
    <div class="chat-area" id="chat-area">
      <div class="welcome-msg" id="welcome-msg">
        <div class="welcome-icon">👻</div>
        <div class="welcome-title">GhostAI Ready</div>
        <div class="welcome-sub">Press <kbd>Alt+Shift+T</kbd> to start transcription<br>
        Press <kbd>Alt+Shift+S</kbd> to take a screenshot</div>
      </div>
    </div>

    <!-- Screenshot Strip -->
    <div class="screenshot-strip" id="screenshot-strip" style="display:none;">
      <div class="ss-label">📸 <span id="ss-count">0</span></div>
      <div class="ss-thumbs" id="ss-thumbs"></div>
    </div>

    <!-- Action Buttons -->
    <div class="actions-bar">
      <button class="action-btn action-suggest" id="btn-suggest" title="Alt+Shift+G">
        <span class="action-icon">💬</span>
        <span>Suggest</span>
      </button>
      <button class="action-btn action-ask" id="btn-ask" title="Alt+Shift+A">
        <span class="action-icon">🧠</span>
        <span>Ask AI</span>
      </button>
      <button class="action-btn action-screen" id="btn-screen" title="Alt+Shift+E">
        <span class="action-icon">🖥️</span>
        <span>Screen</span>
      </button>
      <button class="action-btn action-notes" id="btn-notes" title="Alt+Shift+N">
        <span class="action-icon">📝</span>
        <span>Notes</span>
      </button>
    </div>

    <!-- Bottom Toolbar -->
    <div class="bottom-bar">
      <button class="tool-btn" id="btn-transcribe" title="Toggle Transcription (Alt+Shift+T)">🎙️</button>
      <button class="tool-btn" id="btn-screenshot" title="Screenshot (Alt+Shift+S)">📸</button>
      <button class="tool-btn" id="btn-clear" title="Clear (Alt+Shift+C)">🗑️</button>
      <div class="opacity-control">
        <input type="range" id="opacity-slider" min="10" max="100" value="92" title="Window Opacity">
      </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settings-modal" style="display:none;">
      <div class="modal">
        <div class="modal-header">
          <span>⚙️ Settings</span>
          <button class="modal-close" id="settings-close">✕</button>
        </div>
        <div class="modal-body">
          <label>Groq API Key</label>
          <input type="password" id="input-groq-key" placeholder="gsk_..." spellcheck="false">

          <label>Audio Input Source</label>
          <select id="select-audio-input">
            <option value="default">Default Microphone</option>
          </select>
          <div class="test-mic-info" id="test-mic-info">Check if your mic is picked up below.</div>

          <label>Language</label>
          <select id="select-language">
            <option value="Python">Python</option>
            <option value="JavaScript">JavaScript</option>
            <option value="Java">Java</option>
            <option value="C++">C++</option>
            <option value="TypeScript">TypeScript</option>
            <option value="Go">Go</option>
            <option value="Rust">Rust</option>
            <option value="C#">C#</option>
          </select>

          <button class="save-btn" id="btn-save-settings">Save Settings</button>
        </div>
      </div>
    </div>
  </div>

  <script src="marked.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
